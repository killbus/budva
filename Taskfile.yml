version: "3"

includes:
  common:
    taskfile: ../level85/Taskfile.yml
    flatten: true
    excludes:
      - mock

tasks:
  proto:
    desc: "Generate gRPC proto bindings (requires protoc 34.x on PATH)"
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - protoc -I . --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative internal/transport/grpc/pb/facade.proto

  mock:
    desc: "Generate mocks (via mockery v3)"
    cmds:
      - go run github.com/vektra/mockery/v3@latest
