syntax = "proto3";

package pb;

option go_package = "github.com/pure-golang/budva-claude/internal/transport/grpc/pb";

// FacadeGRPC предоставляет внешний доступ к функциям Telegram.
service FacadeGRPC {
  rpc GetMessages (GetMessagesRequest) returns (MessagesResponse);
  rpc GetChatHistory (GetChatHistoryRequest) returns (MessagesResponse);
  rpc SendMessage (SendMessageRequest) returns (EmptyResponse);
  rpc SendMessageAlbum (SendMessageAlbumRequest) returns (EmptyResponse);
  rpc ForwardMessage (ForwardMessageRequest) returns (EmptyResponse);
  rpc GetMessage (GetMessageRequest) returns (MessageResponse);
  rpc UpdateMessage (UpdateMessageRequest) returns (EmptyResponse);
  rpc DeleteMessages (DeleteMessagesRequest) returns (EmptyResponse);
  rpc GetMessageLink (GetMessageLinkRequest) returns (MessageLinkResponse);
  rpc GetMessageLinkInfo (GetMessageLinkInfoRequest) returns (MessageResponse);
  rpc ResolveBot (ResolveBotRequest) returns (ResolveBotResponse);
  rpc GetBotInfo (GetBotInfoRequest) returns (BotInfoResponse);
  rpc GetInlineMenu (GetInlineMenuRequest) returns (InlineMenuResponse);
  rpc ClickCallbackButton (ClickCallbackButtonRequest) returns (CallbackAnswerResponse);
  rpc SendBotCommand (SendBotCommandRequest) returns (EmptyResponse);
  rpc GetMessageFile (GetMessageFileRequest) returns (stream FileDownloadEvent);
  rpc DownloadFile (DownloadFileRequest) returns (stream FileDownloadEvent);
  rpc ListMessageFiles (ListMessageFilesRequest) returns (ListMessageFilesResponse);
}

message Message {
  int64 id = 1;
  int64 chat_id = 2;
  string text = 3;
  bool forward = 4;
  string file_path = 5;
}

message NewMessage {
  int64 chat_id = 1;
  string text = 2;
  int64 reply_to_message_id = 3;
  string file_path = 4;
}

message GetMessagesRequest {
  int64 chat_id = 1;
  repeated int64 message_ids = 2;
}

message GetChatHistoryRequest {
  int64 chat_id = 1;
  int64 from_message_id = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message SendMessageRequest {
  NewMessage message = 1;
}

message SendMessageAlbumRequest {
  repeated NewMessage messages = 1;
}

message ForwardMessageRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message GetMessageRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message UpdateMessageRequest {
  Message message = 1;
}

message DeleteMessagesRequest {
  int64 chat_id = 1;
  repeated int64 message_ids = 2;
}

message GetMessageLinkRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message GetMessageLinkInfoRequest {
  string link = 1;
}

message MessagesResponse {
  repeated Message messages = 1;
}

message MessageResponse {
  Message message = 1;
}

message MessageLinkResponse {
  string link = 1;
}

message ResolveBotRequest {
  string username = 1;
}

message ResolveBotResponse {
  int64 chat_id = 1;
  int64 bot_user_id = 2;
}

message BotCommand {
  string command = 1;
  string description = 2;
}

message BotMenuButtonInfo {
  string text = 1;
  string url = 2;
}

message GetBotInfoRequest {
  int64 bot_user_id = 1;
}

message BotInfoResponse {
  int64 bot_user_id = 1;
  repeated BotCommand commands = 2;
  BotMenuButtonInfo menu_button = 3;
  string description = 4;
  string short_description = 5;
}

message GetInlineMenuRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message WebAppButtonInfo {
  string text = 1;
  string url = 2;
}

message InlineButton {
  string text = 1;
  oneof action {
    bytes callback_data = 2;
    string url = 3;
    WebAppButtonInfo web_app = 4;
    string other_type = 5;
  }
}

message InlineButtonRow {
  repeated InlineButton buttons = 1;
}

enum MenuKind {
  MENU_KIND_UNSPECIFIED = 0;
  MENU_KIND_NONE = 1;
  MENU_KIND_INLINE = 2;
  MENU_KIND_REPLY = 3;
}

message ReplyButton {
  string text = 1;
  string type = 2;
  string web_app_url = 3;
}

message ReplyButtonRow {
  repeated ReplyButton buttons = 1;
}

message InlineMenuResponse {
  int64 message_id = 1;
  repeated InlineButtonRow rows = 2;
  MenuKind menu_kind = 3;
  repeated ReplyButtonRow reply_rows = 4;
  bool is_persistent = 5;
  bool resize_keyboard = 6;
  bool one_time = 7;
  string input_field_placeholder = 8;
}

message ClickCallbackButtonRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
  bytes callback_data = 3;
}

message CallbackAnswerResponse {
  string text = 1;
  bool show_alert = 2;
  string url = 3;
}

message SendBotCommandRequest {
  int64 chat_id = 1;
  string command = 2;
  int64 bot_user_id = 3;
  string parameter = 4;
}

message GetMessageFileRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message DownloadFileRequest {
  int64 file_id = 1;
}

message ListMessageFilesRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message ListMessageFilesResponse {
  int64 chat_id = 1;
  int64 message_id = 2;
  int64 media_album_id = 3;
  bool content_supported = 4;
  repeated MessageMediaItem items = 5;
  int64 default_file_id = 6;
}

message MessageMediaItem {
  int32 item_index = 1;
  MessageMediaKind kind = 2;
  MessageMediaState state = 3;
  repeated MessageFileDescriptor files = 4;
}

message MessageFileDescriptor {
  int64 file_id = 1;
  MessageFileRole role = 2;
  int32 source_index = 3;
  string file_name = 4;
  string mime_type = 5;
  int64 size = 6;
  bool size_known = 7;
  int32 width = 8;
  int32 height = 9;
  string codec = 10;
  string photo_size_type = 11;
}

enum MessageMediaKind {
  MESSAGE_MEDIA_KIND_UNSPECIFIED = 0;
  MESSAGE_MEDIA_KIND_PHOTO = 1;
  MESSAGE_MEDIA_KIND_VIDEO = 2;
  MESSAGE_MEDIA_KIND_DOCUMENT = 3;
  MESSAGE_MEDIA_KIND_AUDIO = 4;
  MESSAGE_MEDIA_KIND_VOICE_NOTE = 5;
  MESSAGE_MEDIA_KIND_ANIMATION = 6;
  MESSAGE_MEDIA_KIND_VIDEO_NOTE = 7;
  MESSAGE_MEDIA_KIND_STICKER = 8;
  MESSAGE_MEDIA_KIND_PREVIEW = 9;
  MESSAGE_MEDIA_KIND_UNSUPPORTED = 10;
}

enum MessageMediaState {
  MESSAGE_MEDIA_STATE_UNSPECIFIED = 0;
  MESSAGE_MEDIA_STATE_FILES_PRESENT = 1;
  MESSAGE_MEDIA_STATE_LOCKED = 2;
  MESSAGE_MEDIA_STATE_UNSUPPORTED = 3;
  MESSAGE_MEDIA_STATE_NO_FILES = 4;
}

enum MessageFileRole {
  MESSAGE_FILE_ROLE_UNSPECIFIED = 0;
  MESSAGE_FILE_ROLE_MAIN = 1;
  MESSAGE_FILE_ROLE_PHOTO_SIZE = 2;
  MESSAGE_FILE_ROLE_ALTERNATIVE_VIDEO = 3;
  MESSAGE_FILE_ROLE_HLS_PLAYLIST = 4;
  MESSAGE_FILE_ROLE_THUMBNAIL = 5;
  MESSAGE_FILE_ROLE_ALBUM_COVER = 6;
  MESSAGE_FILE_ROLE_EXTERNAL_ALBUM_COVER = 7;
  MESSAGE_FILE_ROLE_PREMIUM_ANIMATION = 8;
}

message FileDownloadMetadata {
  int64 file_id = 1;
  string mime_type = 2;
  int64 size = 3;
  bool size_known = 4;
}

message FileDownloadChunk {
  int64 offset = 1;
  bytes data = 2;
  bool upstream_complete = 3;
}

message FileDownloadComplete {
  int64 size = 1;
}

message FileDownloadEvent {
  oneof event {
    FileDownloadMetadata metadata = 1;
    FileDownloadChunk chunk = 2;
    FileDownloadComplete complete = 3;
  }
}

message EmptyResponse {}
