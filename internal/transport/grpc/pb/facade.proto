syntax = "proto3";

package pb;

option go_package = "github.com/pure-golang/budva-claude/internal/transport/grpc/pb";

// FacadeGRPC предоставляет внешний доступ к функциям Telegram.
service FacadeGRPC {
  rpc GetMessages (GetMessagesRequest) returns (MessagesResponse);
  rpc GetChatHistory (GetChatHistoryRequest) returns (MessagesResponse);
  rpc SendMessage (SendMessageRequest) returns (EmptyResponse);
  rpc SendMessageAlbum (SendMessageAlbumRequest) returns (EmptyResponse);
  rpc ForwardMessage (ForwardMessageRequest) returns (EmptyResponse);
  rpc GetMessage (GetMessageRequest) returns (MessageResponse);
  rpc UpdateMessage (UpdateMessageRequest) returns (EmptyResponse);
  rpc DeleteMessages (DeleteMessagesRequest) returns (EmptyResponse);
  rpc GetMessageLink (GetMessageLinkRequest) returns (MessageLinkResponse);
  rpc GetMessageLinkInfo (GetMessageLinkInfoRequest) returns (MessageResponse);
  rpc ResolveBot (ResolveBotRequest) returns (ResolveBotResponse);
  rpc GetBotInfo (GetBotInfoRequest) returns (BotInfoResponse);
  rpc GetInlineMenu (GetInlineMenuRequest) returns (InlineMenuResponse);
  rpc ClickCallbackButton (ClickCallbackButtonRequest) returns (CallbackAnswerResponse);
  rpc SendBotCommand (SendBotCommandRequest) returns (EmptyResponse);
}

message Message {
  int64 id = 1;
  int64 chat_id = 2;
  string text = 3;
  bool forward = 4;
  string file_path = 5;
}

message NewMessage {
  int64 chat_id = 1;
  string text = 2;
  int64 reply_to_message_id = 3;
  string file_path = 4;
}

message GetMessagesRequest {
  int64 chat_id = 1;
  repeated int64 message_ids = 2;
}

message GetChatHistoryRequest {
  int64 chat_id = 1;
  int64 from_message_id = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message SendMessageRequest {
  NewMessage message = 1;
}

message SendMessageAlbumRequest {
  repeated NewMessage messages = 1;
}

message ForwardMessageRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message GetMessageRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message UpdateMessageRequest {
  Message message = 1;
}

message DeleteMessagesRequest {
  int64 chat_id = 1;
  repeated int64 message_ids = 2;
}

message GetMessageLinkRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message GetMessageLinkInfoRequest {
  string link = 1;
}

message MessagesResponse {
  repeated Message messages = 1;
}

message MessageResponse {
  Message message = 1;
}

message MessageLinkResponse {
  string link = 1;
}

message ResolveBotRequest {
  string username = 1;
}

message ResolveBotResponse {
  int64 chat_id = 1;
  int64 bot_user_id = 2;
}

message BotCommand {
  string command = 1;
  string description = 2;
}

message BotMenuButtonInfo {
  string text = 1;
  string url = 2;
}

message GetBotInfoRequest {
  int64 bot_user_id = 1;
}

message BotInfoResponse {
  int64 bot_user_id = 1;
  repeated BotCommand commands = 2;
  BotMenuButtonInfo menu_button = 3;
  string description = 4;
  string short_description = 5;
}

message GetInlineMenuRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
}

message WebAppButtonInfo {
  string text = 1;
  string url = 2;
}

message InlineButton {
  string text = 1;
  oneof action {
    bytes callback_data = 2;
    string url = 3;
    WebAppButtonInfo web_app = 4;
    string other_type = 5;
  }
}

message InlineButtonRow {
  repeated InlineButton buttons = 1;
}

enum MenuKind {
  MENU_KIND_UNSPECIFIED = 0;
  MENU_KIND_NONE = 1;
  MENU_KIND_INLINE = 2;
  MENU_KIND_REPLY = 3;
}

message ReplyButton {
  string text = 1;
  string type = 2;
  string web_app_url = 3;
}

message ReplyButtonRow {
  repeated ReplyButton buttons = 1;
}

message InlineMenuResponse {
  int64 message_id = 1;
  repeated InlineButtonRow rows = 2;
  MenuKind menu_kind = 3;
  repeated ReplyButtonRow reply_rows = 4;
  bool is_persistent = 5;
  bool resize_keyboard = 6;
  bool one_time = 7;
  string input_field_placeholder = 8;
}

message ClickCallbackButtonRequest {
  int64 chat_id = 1;
  int64 message_id = 2;
  bytes callback_data = 3;
}

message CallbackAnswerResponse {
  string text = 1;
  bool show_alert = 2;
  string url = 3;
}

message SendBotCommandRequest {
  int64 chat_id = 1;
  string command = 2;
  int64 bot_user_id = 3;
  string parameter = 4;
}

message EmptyResponse {}
